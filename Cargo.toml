[workspace]
resolver = "3"
members = ["crates/ui", "crates/shell"]

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trifonovsdev/macRust"
authors = ["trifonovsdev"]

[workspace.dependencies]
tiny-skia = "0.12.0"
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, not abort: a panic in a background thread (media, notifications)
# must end only that feature, not the whole shell.
panic = "unwind"
strip = true

# tiny-skia and the glyph rasterizer are unusably slow without optimizations.
[profile.dev.package."*"]
opt-level = 3
